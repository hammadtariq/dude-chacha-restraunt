<!doctype html>
<html lang="en" class="dark scroll-smooth"><head>
<meta charset="utf-8">
<script>
 (() => {
  let saved;
  try { saved = localStorage.getItem('dude-chacha-theme'); } catch {}
  const theme = saved === 'light' || saved === 'dark' ? saved : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  document.documentElement.dataset.theme = theme;
  document.documentElement.classList.toggle('dark', theme === 'dark');
  // Splash: once per browser session, never with reduced motion.
  try {
   if (!sessionStorage.getItem('dude-chacha-splash') && !window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    sessionStorage.setItem('dude-chacha-splash', '1');
    document.documentElement.classList.add('splash-lock');
    document.documentElement.style.setProperty('--splash-delay', '1700ms');
   }
  } catch {}
 })();
</script>
